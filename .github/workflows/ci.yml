name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:check

  stress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter triplex-stress stress-test:smoke

  docs-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres:integration

  foundationdb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FDB_VERSION: 7.3.75
      FDB_TEST_IMAGE: foundationdb/foundationdb:7.3.75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load the pinned FoundationDB client without a system installation
        run: |
          mkdir -p "$RUNNER_TEMP/fdb-client"
          cd "$RUNNER_TEMP/fdb-client"
          curl --fail --location --retry 3 "https://github.com/apple/foundationdb/releases/download/$FDB_VERSION/libfdb_c.x86_64.so" --output libfdb_c.x86_64.so
          curl --fail --location --retry 3 "https://github.com/apple/foundationdb/releases/download/$FDB_VERSION/libfdb_c.x86_64.so.sha256" --output libfdb_c.x86_64.so.sha256
          sha256sum --check libfdb_c.x86_64.so.sha256
          ln -s libfdb_c.x86_64.so libfdb_c.so
          printf 'LD_LIBRARY_PATH=%s\n' "$PWD" >> "$GITHUB_ENV"
      - name: Require native bindings so the gate cannot silently skip
        run: pnpm --filter @triplex-build/triplex-foundationdb exec node -e 'require("foundationdb")'
      - run: pnpm test:foundationdb:integration
