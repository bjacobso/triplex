name: Preview documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: triplex-docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        id: credentials
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping preview deploy or cleanup: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID Actions secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.available == 'true'
      - name: Deploy preview
        shell: bash
        if: steps.credentials.outputs.available == 'true' && github.event.action != 'closed'
        run: pnpm exec alchemy deploy --stage "$STAGE" --yes --no-input 2>&1 | tee "$RUNNER_TEMP/alchemy-preview.log"
      - name: Destroy preview
        if: steps.credentials.outputs.available == 'true' && github.event.action == 'closed'
        run: pnpm exec alchemy destroy --stage "$STAGE" --yes --no-input
      - name: Update preview comment
        if: steps.credentials.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- triplex-docs-preview -->';
            let body = `${marker}\nDocumentation preview removed (PR closed).`;
            if (context.payload.action !== 'closed') {
              const { readFileSync } = require('node:fs');
              const log = readFileSync(`${process.env.RUNNER_TEMP}/alchemy-preview.log`, 'utf8');
              const url = log.match(new RegExp(`https://triplex-docs-${process.env.STAGE}\\.[a-z0-9-]+\\.workers\\.dev`))?.[0];
              if (!url) throw new Error('Alchemy did not output the expected preview workers.dev URL');
              body = `${marker}\nDocumentation preview: ${url}\n\nCommit: ${context.payload.pull_request.head.sha}`;
            }
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const comment = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (comment) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body });
            } else if (context.payload.action !== 'closed') {
              await github.rest.issues.createComment({ ...issue, body });
            }
