name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here; use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Triplex and Effect versions
      placeholder: "@bjacobso/triplex@…; effect@…"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [In-memory KV, SQLite, PostgreSQL, Cloudflare, FoundationDB, Not backend-specific]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, code, inputs, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Node version, operating system, and relevant runtime details"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the current-state document and searched existing issues.
          required: true
